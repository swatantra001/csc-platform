name: Deploy to EC2 Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Execute Deployment Script via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: rm0644320
        key: ${{ secrets.EC2_SSH_KEY }}
        command_timeout: 30m  # Changed from 'timeout' to 'command_timeout'
        script: |
          set -e  # Forces pipeline to crash if any step fails
          
          # 1. Navigate to the project root on EC2
          cd /home/ubuntu/csc-platform
          
          # 2. Pull latest standalone web code
          git reset --hard
          git pull origin main
          
          # 3. Inject the .env.local file SAFELY at the ROOT
          cat << 'EOF' > .env.local
          ${{ secrets.ENV_FILE }}
          EOF
          
          # 4. Clean up old build cache and install dependencies
          rm -rf .next node_modules .npmrc "D:\\p-vs"
          export CI=true
          pnpm install --ignore-scripts --no-frozen-lockfile
          
          # 5. Build the Next.js web app (No monorepo filters needed!)
          NODE_OPTIONS="--max-old-space-size=3072" pnpm build
          
          # 6. Restart the Socket.io server directly in the root
          export NODE_ENV=production
          pm2 restart csc-web --update-env || pm2 start server.js --name "csc-web"
          
          # 7. Save PM2 state to survive server reboots
          pm2 save