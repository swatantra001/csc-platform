name: Deploy to GCP Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 12.18.0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile --ignore-scripts

    - name: Inject Environment Variables
      run: |
        cat << 'EOF' > .env.local
        ${{ secrets.ENV_FILE }}
        EOF

    - name: Build Next.js App
      run: pnpm build

    - name: Shrink node_modules (Keep only production)
      run: pnpm prune --prod

    - name: Compress Build Artifacts
      run: tar -czf release.tar.gz .next node_modules public package.json .env.local server.js

    - name: Upload to GCP via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: rm0644320
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "release.tar.gz"
        target: "/home/rm0644320/csc-platform"

    - name: Extract and Restart PM2 on GCP
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: rm0644320
        key: ${{ secrets.EC2_SSH_KEY }}
        command_timeout: 60m
        script: |
          cd /home/rm0644320/csc-platform
          # Adding 'm' flag ignores original timestamps, reducing disk writes
          tar -xzmf release.tar.gz
          rm release.tar.gz
          export NODE_ENV=production
          pm2 restart csc-web --update-env || pm2 start server.js --name "csc-web"
          pm2 save